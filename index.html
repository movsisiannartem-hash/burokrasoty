<!doctype html>
<html lang="ru">

<body>
  <header class="site-header shell">

        <path d="M2 6h22"/><path d="M2 13h22"/><path d="M2 20h22"/>
      </svg>
    </button>

    <div class="hero__grid">
      <div class="collage">
        <picture class="collage__portrait">
          <source media="(width < 640px)" srcset="assets/images/portrait-mobile-420.webp 420w, assets/images/portrait-mobile-720.webp 720w" sizes="72vw">
          <img src="assets/images/portrait-1200.webp"
               srcset="assets/images/portrait-768.webp 768w, assets/images/portrait-1200.webp 1200w, assets/images/portrait-1495.webp 1495w"
               sizes="(width < 900px) 49vw, 54vw" width="1495" height="1052"
               alt="Портрет девушки в тёплом свете" fetchpriority="high">
        </picture>
        <img class="collage__manicure" src="assets/images/manicure.webp" width="400" height="510"
             alt="Нюдовый маникюр на фоне светлого камня">
      </div>

      <div class="hero__intro">
        <h1 class="hero-title">
          <span class="hero-title__line">Искусство</span>
          <em class="hero-title__line">быть собой.</em>

        <div class="hero__actions">

              <path d="M5 19 19 5M8 5h11v11"/>

          </a>
        </div>
      </div>
    </div>

    <p class="wordmark"><span>БЮРО</span> <span>КРАСОТЫ</span></p>
  </main>

  <dialog class="menu" id="mobile-menu" aria-label="Меню">
    <div class="menu__body">
      <div class="menu__header">
        <a class="brand" href="./" aria-label="Бюро красоты, главная">

        <form method="dialog">

              <path d="M2 6h22"/><path d="M2 13h22"/><path d="M2 20h22"/>

          </button>

      </div>

      <nav class="menu__nav" aria-label="Основная навигация">
        <a data-section="services" href="https://yandex.ru/maps/org/byuro_krasoty/233790800142/prices/">Услуги</a>

      <a class="button button--arrow menu__booking" href="https://n1221136.yclients.ru/">

          <path d="M2 12h19m-6-6 6 6-6 6"/>
        </svg>
      </a>
    </div>
  </dialog>

  <div class="section-notice" id="section-notice" hidden>
    <p class="section-notice__message"></p>
    <a class="button section-notice__booking" href="https://n1221136.yclients.ru/">Записаться</a>
    <button class="section-notice__close" type="button" aria-label="Закрыть уведомление">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="m5 5 14 14M19 5 5 19"/>
